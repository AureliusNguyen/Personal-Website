<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150708"/>
      <stop offset="100%" stop-color="#0a0405"/>
    </linearGradient>
    <linearGradient id="cardFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6efe6"/>
      <stop offset="100%" stop-color="#dcd1bd"/>
    </linearGradient>
    <linearGradient id="cardFaceTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffaf2"/>
      <stop offset="100%" stop-color="#e8ddc5"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0v56" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.04"/>
    </pattern>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="900" height="600" fill="url(#cardBg)"/>
  <rect width="900" height="600" fill="url(#grid)"/>

  <!-- Crimson glow behind the stack -->
  <ellipse cx="450" cy="320" rx="320" ry="140" fill="#e63946" opacity="0.18"/>

  <!-- Bottom card -->
  <g transform="translate(220 250) rotate(-8)" filter="url(#cardShadow)">
    <rect width="460" height="260" rx="14" fill="url(#cardFace)"/>
    <rect x="14" y="14" width="432" height="232" rx="9" fill="none" stroke="#a08763" stroke-width="1.5" opacity="0.55"/>
    <line x1="40" y1="90"  x2="420" y2="90"  stroke="#9a7e54" stroke-width="1" opacity="0.45"/>
    <line x1="40" y1="130" x2="420" y2="130" stroke="#9a7e54" stroke-width="1" opacity="0.45"/>
    <line x1="40" y1="170" x2="420" y2="170" stroke="#9a7e54" stroke-width="1" opacity="0.45"/>
    <line x1="40" y1="210" x2="320" y2="210" stroke="#9a7e54" stroke-width="1" opacity="0.45"/>
  </g>

  <!-- Middle card -->
  <g transform="translate(240 230) rotate(2)" filter="url(#cardShadow)">
    <rect width="460" height="260" rx="14" fill="url(#cardFaceTop)"/>
    <rect x="14" y="14" width="432" height="232" rx="9" fill="none" stroke="#a08763" stroke-width="1.5" opacity="0.55"/>
    <line x1="40" y1="90"  x2="420" y2="90"  stroke="#9a7e54" stroke-width="1" opacity="0.45"/>
    <line x1="40" y1="130" x2="420" y2="130" stroke="#9a7e54" stroke-width="1" opacity="0.45"/>
    <line x1="40" y1="170" x2="420" y2="170" stroke="#9a7e54" stroke-width="1" opacity="0.45"/>
  </g>

  <!-- Top card with Q/A -->
  <g transform="translate(260 200) rotate(-3)" filter="url(#cardShadow)">
    <rect width="460" height="260" rx="14" fill="url(#cardFaceTop)"/>
    <rect x="14" y="14" width="432" height="232" rx="9" fill="none" stroke="#a08763" stroke-width="1.5" opacity="0.6"/>
    <text x="36" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#3a1f1f">Q.</text>
    <line x1="40" y1="118" x2="420" y2="118" stroke="#9a7e54" stroke-width="1" opacity="0.55"/>
    <line x1="40" y1="156" x2="420" y2="156" stroke="#9a7e54" stroke-width="1" opacity="0.55"/>
    <line x1="40" y1="194" x2="300" y2="194" stroke="#9a7e54" stroke-width="1" opacity="0.55"/>
    <text x="36" y="232" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#7a1721">A</text>
  </g>
</svg>
